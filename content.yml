# All portfolio content lives here. Edit, push to main, and the site rebuilds.
# Any section left empty (or removed) is hidden from the page, nav and ⌘K palette.

site:
  title: Samarth Sangam | Portfolio
  description: Portfolio of Samarth Sangam, Full Stack Web Developer based in Bangalore, India.
  # Terminal prompt shown before every section command: <user>@<host>:~$
  user: samarth
  host: portfolio
  # primary = prompt / accents, secondary = paths / links. Visitors toggle via the header button.
  theme:
    dark:
      primary: "#3fb950"
      secondary: "#58a6ff"
    light:
      primary: "#1a7f37"
      secondary: "#0969da"

profile:
  name: Samarth Sangam
  role: Senior Software Engineer
  location: Bangalore, India
  careerStart: 2019 # used to render "N+ years"
  # avatar: /avatar.jpg # optional, put the file in /public
  # email: you@example.com # optional, enables the "mail" CTA in Contact
  typed:
    - Senior Software Engineer
    - Full Stack Developer
    - Java & Spring Boot
    - React & Next.js
    - Cloud & Distributed Systems
  about: |
    I'm a Bangalore-based Senior Software Engineer building full stack systems, from Spring Boot services and event-driven backends to React and Next.js frontends.

    I optimize systems for performance, scalability, and maintainability. I design architectures and implement solutions that meet these goals. I lead rebuilds of legacy systems, modernise platforms (Java 8 → 21, jQuery → React, Monolith → Microservices), set technical direction through design spikes, and mentor engineers along the way.

